name: Secure RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          
          # Disable Network Level Authentication (NLA)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          # Firewall Rule for RDP
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          # Restart RDP Service
          Restart-Service -Name TermService -Force
          Write-Host "RDP Configured Successfully."

      - name: Create or Update RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Convert the secret to a SecureString
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          
          # Check if user exists, if not create with a temporary short password to bypass the 14-char warning
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              $tempPass = ConvertTo-SecureString "TempP@ssw0rd123" -AsPlainText -Force
              New-LocalUser -Name "RDP" -Password $tempPass -AccountNeverExpires
              Write-Host "User created with temporary password."
          }
          
          # Update the password to the real secure long password
          Set-LocalUser -Name "RDP" -Password $securePass
          Write-Host "Password updated successfully."
          
          # Add user to groups safely (SilentlyContinue prevents errors if already added)
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          
          Write-Host "RDP User Configured Successfully."
          
          # Safely write to environment variable
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PASSWORD=$env:RDP_PASSWORD"

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          # Use fixed hostname and ephemeral flag
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-rdp-runner --ephemeral
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          
          Write-Host "Tailscale IP is: $tsIP"
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Checking connectivity to $env:TAILSCALE_IP on port 3389..."
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed!"
          } else {
              Write-Host "TCP connectivity successful!"
          }

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS DETAILS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==========================`n"
          
          # Keep runner active for the full 6 hours
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Waiting for connection..."
              Start-Sleep -Seconds 300
          }
